name: Build Executables

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: FuzzyMatcher_Windows.exe
            asset_name: FuzzyMatcher_Windows.exe
          - os: ubuntu-latest
            artifact_name: FuzzyMatcher_Linux
            asset_name: FuzzyMatcher_Linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Executable
        if: runner.os == 'Windows'
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed --icon="icon.ico" `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --add-data "scorers;scorers" `
            --hidden-import "sklearn.feature_extraction.text" `
            --hidden-import "sklearn.metrics.pairwise" `
            --hidden-import "sklearn.utils._cython_blas" `
            --hidden-import "sklearn.neighbors._partition_nodes" `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.protocols.websockets.auto" `
            --hidden-import "uvicorn.lifespan.on" `
            --hidden-import "anyio._backends._asyncio" `
            --name "FuzzyMatcher_Windows" `
            app.py

      - name: Build Linux Executable
        if: runner.os == 'Linux'
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --add-data "scorers:scorers" \
            --hidden-import "sklearn.feature_extraction.text" \
            --hidden-import "sklearn.metrics.pairwise" \
            --hidden-import "sklearn.utils._cython_blas" \
            --hidden-import "sklearn.neighbors._partition_nodes" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --hidden-import "uvicorn.lifespan.on" \
            --hidden-import "anyio._backends._asyncio" \
            --name "FuzzyMatcher_Linux" \
            app.py

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
